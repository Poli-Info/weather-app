<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Instrument — Météo</title>
<meta name="theme-color" content="#12203A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
  <!--------- Sidebar --------->
  <nav class="sidebar">
    <header>
      <div class="image-text">
        <span class="image">
          <img src="icons/ufo.png" alt="logo">
        </span>
        
        <div class="text header-text">
          <span class="name">PoliScop</span>
          <span class="secondName">Around The World</span>
        </div>
      </div>
          <img id="toggle" src="icons/caret-big-right.png" alt="slidebar">
      <div class="menu-bar">
        <div class="menu">
          <ul>
            <li class="search-box">
              <img src="icons/search.png" alt="accueil">
              <input id="search" type="search" placeholder="Rechercher...">
            </li>
          </ul>  
          <ul class="menu-links">
            <li class="nav-links">
              <a href="#">
                <img src="icons/home-alt-2.png" alt="accueil">
                <span class="text text-nav">Accueil</span>
              </a>
            </li>
            <li class="nav-links">
              <a href="#">
                <img src="icons/cloud-sun.png" alt="météo">
                <span class="text text-nav">Météo</span>
              </a>
            </li>
            <li class="nav-links">
              <a href="#">
                <img src="icons/compass-tool.png" alt="outils3">
                <span class="text text-nav">Outils3</span>
              </a>
            </li>
            <li class="nav-links">
              <a href="#">
                <img src="icons/compass-tool.png" alt="outils4">
                <span class="text text-nav">Outils4</span>
              </a>
            </li>
          </ul>
        </div>

        <div class="bottom-content">
          <li class="mode">
            <div class="moon-sun">
                <img class="moon" src="icons/moon-stars.png" alt="outils4">
                <img class="sun" src="icons/sun.png" alt="outils4">
            </div>
            <span class="text mode-text">Bright Mode</span>
            <div class="text toggle-switch">
              <span class="switch"></span>
            </div>
            </li>

        </div>
      </div>
    </header>
  </nav>
  <!------- FIN Sidebar ------->

  <div id="app">
    <form id="search-form" class="search-row">
      <input id="city-input" type="text" placeholder="Chercher une ville…" autocomplete="off" inputmode="search">
      <button type="button" id="locate-btn" aria-label="Utiliser ma position">📍</button>
    </form>
    <div id="suggestions" class="suggestions"></div>

    <div id="main-panel">
      <div class="status-panel">Chargement…</div>
    </div>

    <div class="footer-note">Données Open-Meteo · fait pour tester</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
