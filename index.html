<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Instrument — Météo</title>
<meta name="theme-color" content="#12203A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <form id="search-form" class="search-row">
    <input id="city-input" type="text" placeholder="Chercher une ville…" autocomplete="off" inputmode="search">
    <button type="button" id="locate-btn" aria-label="Utiliser ma position">📍</button>
  </form>
  <div id="suggestions" class="suggestions"></div>

  <div id="main-panel">
    <div class="status-panel">Chargement…</div>
  </div>

  <div class="footer-note">Données Open-Meteo · fait pour tester</div>
</div>
<script src="app.js"></script>
</body>
</html>
